name: "CI - Test tools"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image:
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - uses: actions/checkout@v7

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test tools defaults on ${{ matrix.base-image }}
        run: devcontainer features test --skip-scenarios -f tools -i "${{ matrix.base-image }}" .

  test-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test tools scenarios
        run: devcontainer features test -f tools --skip-autogenerated --skip-duplicated .
